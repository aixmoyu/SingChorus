# chorus-panel self-hosted compose (option A: standalone panel image + host docker.sock).
#
# How it works: the panel container only ships the docker CLI and drives sing-box
# containers through the mounted host sock (DooD, not DinD, no privileged needed).
# The sing-box compose is rendered by cloud using ./data and ./tls relative volumes —
# the CLI converts them to absolute paths ($HOME/.singchorus/docker/...) on the
# panel container side before the host daemon resolves them.
#
# Key constraint: the absolute path of $HOME/.singchorus inside the container must
# match the host exactly, otherwise sing-box volume mounts point to nonexistent
# host paths. Use SINGCHORUS_HOME to control both sides (default /root, which
# works out of the box for root-deployed VPS):
#   SINGCHORUS_HOME=/home/admin docker compose up -d --build
#
# Security note: mounting docker.sock grants panel root-equivalent access on the
# host. Always finish the setup wizard to set an admin password, and configure
# CORS / reverse proxy as needed.
services:
  panel:
    # build:
    #   context: ../.. # repo root (the Dockerfile relies on the monorepo workspace)
    #   dockerfile: packages/panel/Dockerfile
    # Defaults to a local build; to use the published GHCR image:
    #   PANEL_IMAGE=ghcr.io/<owner>/chorus-panel:latest docker compose up -d
    # image: ${PANEL_IMAGE:-chorus-panel:latest}
    image: ghcr.io/aixmoyu/chorus-panel:latest
    container_name: chorus-panel
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-8088}:8088"
    environment:
      CHORUS_PANEL_HOST: 0.0.0.0
      HOME: ${SINGCHORUS_HOME:-/root}
      # Optional production settings (see server/env.ts):
      # Allowed origins when the panel API is accessed cross-origin (comma-separated)
      # CHORUS_PANEL_CORS_ORIGIN: https://panel.example.com
      # Required behind a reverse proxy (Nginx/Caddy terminating TLS) so the
      # login rate limiter can see the real client IP
      # CHORUS_PANEL_TRUST_PROXY: "true"
      # Log level (default info)
      # CHORUS_LOG_LEVEL: debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SINGCHORUS_HOME:-/root}/.singchorus:${SINGCHORUS_HOME:-/root}/.singchorus
    # If cloud runs on the host's localhost, use http://host.docker.internal:8787
    # as the core_url (fill in during the setup wizard); the line below makes
    # that resolvable on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
