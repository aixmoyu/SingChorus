name: Publish cloud image

# 发布 chorus-cloud 镜像到 GHCR：
#   - tag cloud-v0.1.0  → ghcr.io/<owner>/chorus-cloud:{0.1.0, 0.1, latest}
#   - main 分支相关改动  → ghcr.io/<owner>/chorus-cloud:edge（持续通道）
#   - 手动 workflow_dispatch → 同上按当前 ref 打标
on:
  push:
    branches: [main]
    tags: ['cloud-v*']
    paths:
      - 'packages/cloud/**'
      - '.github/workflows/docker-cloud.yml'
  # PR 只做构建校验（不登录、不推送），在合并前抓 Dockerfile/依赖破坏
  pull_request:
    paths:
      - 'packages/cloud/**'
      - '.github/workflows/docker-cloud.yml'
  workflow_dispatch:

# 同一 ref 的重复触发只保留最新一次，避免并行推送互相覆盖
concurrency:
  group: cloud-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推 ghcr.io 仅需 GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chorus-cloud
          tags: |
            # cloud-v0.1.0 → 0.1.0 / 0.1 / latest
            type=match,pattern=cloud-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=cloud-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/cloud-v') }}
            # main 分支持续通道
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: . # 仓库根目录（Dockerfile 依赖 monorepo workspace）
          file: packages/cloud/Dockerfile
          # PR 校验只跑单架构，推送时才出双架构镜像
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=chorus-cloud
          cache-to: type=gha,mode=max,scope=chorus-cloud
