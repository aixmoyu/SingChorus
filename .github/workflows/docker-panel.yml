name: Publish panel image

# 发布 chorus-panel 镜像到 GHCR：
#   - tag panel-v0.2.0  → ghcr.io/<owner>/chorus-panel:{0.2.0, 0.2, latest}
#   - main 分支相关改动  → ghcr.io/<owner>/chorus-panel:edge（持续通道）
#   - 手动 workflow_dispatch → 同上按当前 ref 打标
on:
  push:
    branches: [main]
    tags: ['panel-v*']
    paths:
      - 'packages/panel/**'
      - 'packages/core/**'
      - '.github/workflows/docker-panel.yml'
  workflow_dispatch:

# 同一 ref 的重复触发只保留最新一次，避免并行推送互相覆盖
concurrency:
  group: panel-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推 ghcr.io 仅需 GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chorus-panel
          tags: |
            # panel-v0.2.0 → 0.2.0 / 0.2 / latest
            type=match,pattern=panel-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=panel-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/panel-v') }}
            # main 分支持续通道
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: . # 仓库根目录（Dockerfile 依赖 monorepo workspace）
          file: packages/panel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=chorus-panel
          cache-to: type=gha,mode=max,scope=chorus-panel
