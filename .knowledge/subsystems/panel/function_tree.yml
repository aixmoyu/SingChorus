    depends_on: []
    node_context:
      keywords: ["npx_entry", "prebuilt"]
      code_mapping:
        - "packages/panel/bin/chorus-panel.mjs:4-9,30-51"
        - "packages/panel/package.json:12-19"
  - id: '1104'
