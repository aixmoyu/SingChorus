  - id: '992'
    type: function
    name: 抛出统一业务错误
    description: AppError（code/message/statusCode/details）与 ERRORS 错误码表统一模块内错误语义。
    depends_on: []
    node_context:
      keywords: ["app_error", "error_codes"]
      code_mapping:
        - "packages/core/src/errors.ts:1-21"
  - id: '993'
    type: function
    name: 组合节点标签
    description: slugifyName 归一化节点名；composeTag 生成 `<node>-<协议短名>-<6位随机>` 标签。
    depends_on: []
    node_context:
      keywords: ["tag", "slug", "random_suffix"]
      code_mapping:
        - "packages/core/src/tag.ts:10-33"

# ── 全局功能树映射（../../architecture_views/function_tree.yml, base_commit 5ab6e0b）──
# 用例编排域 → 804 管理系统设置（持久化权威端，合并判定 M10）
# 配置生命周期域 → 101 管理节点配置（M1）
# 本地持久化域 → 1001 持久化本地状态
# 跨进程互斥域 → 1002 互斥跨进程资源访问
# 云端通信域 → 401 管理协议模板 / 402 渲染配置制品 / 501 管理订阅 / 601 管理节点身份 / 102 预检配置资源冲突
# 自动同步域 → 202 自动触发同步
# 双向同步域 → 201 执行双向同步（M2）/ 203 恢复云端配置
# 部署执行域 → 301 部署节点服务（M3）/ 302 管理容器生命周期
# 配置校验域 → 701 校验 sing-box 配置（M8）
# 配置合并域 → 402 渲染配置制品（本地合并侧）
# 基础支撑域 → 11 运行支撑域（横切支撑能力）
