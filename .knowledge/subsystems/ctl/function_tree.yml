  # ── CLI 输出与交互域（跨切面） ────────────────────────────────────────────
  - id: '18'
    type: directory
    name: CLI 输出与交互域
    description: 跨所有命令的输出契约（--json 双模式）、错误出口、交互确认与参数解析。packages/ctl/src/utils.ts、packages/ctl/src/config.ts、packages/ctl/src/index.ts
    children:
    - id: '181'
      type: function
      name: 输出机器可读结果
      description: 所有命令按 --json 开关在 JSON/人读双模式间切换输出。
      depends_on: []
      node_context:
        keywords: ["json_contract", "dual_mode_output", "r_ctl_d4"]
        code_mapping:
          - "packages/ctl/src/utils.ts:4-59"
          - "packages/ctl/src/config.ts"
      children:
      - id: '18101'
        type: function_point
        name: 双模式结果打印
        description: JSON 模式 printJson（2 空格缩进）；人读模式表格/彩色文案。各 print* 帮助函数按数据形态分流。
        input: 结果对象
        process: isJson() 分支 → printJson 或 console.table/文案
        output: stdout
        code_mapping: ["packages/ctl/src/utils.ts:75-209"]
      - id: '18102'
        type: function_point
        name: 统一错误出口
        description: fail() 统一错误输出：JSON 模式 { ok:false, error[, detail] }，人读模式红色文案；随后退出码 1。
        input: 错误消息 + 可选 detail
        process: isJson() 分支 → JSON/文案 → process.exit(1)
        output: stderr/stdout + 退出码 1
        code_mapping: ["packages/ctl/src/utils.ts:16-24"]
      - id: '18103'
        type: function_spec
        name: --json 单次调用契约
        description: --json 是单次调用的输出契约，属进程内存态，不落盘；脚本集成必须用 --json，人读文案格式不保证稳定。
        code_mapping: ["packages/ctl/src/config.ts:1-13", "packages/ctl/src/index.ts:19"]
      - id: '18104'
        type: function_constraint
        name: 敏感信息脱敏约束
        description: JSON 输出不得回显 token 明文，只允许 token_set 布尔或前 8 位截断。
        code_mapping: ["packages/ctl/src/commands/cloud.ts:106-107", "packages/ctl/src/utils.ts:208", "packages/ctl/src/commands/subscription.ts:103"]
    - id: '182'
      type: function
      name: 保障脚本安全的交互确认
      description: 变更类命令的确认机制在非 TTY 环境自动返回 false，脚本永不被悬空 stdin 卡住。
      depends_on: []
      node_context:
        keywords: ["confirm_guard", "non_tty", "script_safe"]
        code_mapping:
          - "packages/ctl/src/utils.ts:45-53"
      children:
      - id: '18201'
        type: function_point
        name: 非 TTY 自动拒绝确认
        description: stdin 非 TTY 直接返回 false；提示文本走 stderr，由调用方决定是否以「需要 -y」失败。
        input: 确认问题文本
        process: process.stdin.isTTY 检查 → readline 提问 → /^y(es)?$/i 判定
        output: boolean
        constraint: 非交互环境必须配合 -y 选项完成变更类操作
        code_mapping: ["packages/ctl/src/utils.ts:45-53"]
    - id: '183'
      type: function
      name: 解析 key=value 参数
      description: 将 key=value 形式的参数令牌解析为字典，供配置参数传递。
      depends_on: []
      node_context:
        keywords: ["param_parsing", "strict_token"]
        code_mapping:
          - "packages/ctl/src/utils.ts:30-38"
      children:
      - id: '18301'
        type: function_point
        name: 严格解析参数令牌
        description: 无 '=' 或空 key 的条目立即报错退出，不静默跳过，避免吞掉拼错的参数。
        input: token 数组
        process: indexOf('=') 切分（value 可含 '='）
        output: Record<string, string>
        constraint: 非法条目经 fail() 以退出码 1 终止
        code_mapping: ["packages/ctl/src/utils.ts:30-38"]

